[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

# Force light theme regardless of the user's OS / browser color scheme.
# Without this, dark-mode users see white-on-white text in elements that
# inherit the default theme (e.g. <pre> blocks inside expanders).
[theme]
base                     = "light"
primaryColor             = "#DC6B2F"
backgroundColor          = "#FAFAFA"
secondaryBackgroundColor = "#FFFFFF"
textColor                = "#1A1A1A"
font                     = "sans serif"
